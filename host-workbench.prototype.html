<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TTSync 主持人工作台原型</title>
  <!--
    PROTOTYPE — throw away after the decision.
    Question: which low-fidelity layout best supports team setup, assignment, capacity warnings and read-only understanding?
    Three variants of a new host workbench, switchable via ?variant=A|B|C on this standalone prototype page.
    Run: python -m http.server 4173
  -->
  <style>
    :root {
      color-scheme: light;
      --ink: #17221d;
      --muted: #67736d;
      --line: #d8dfda;
      --paper: #f6f8f5;
      --panel: #ffffff;
      --accent: #166b4f;
      --accent-soft: #dff3e9;
      --warn: #ad5a11;
      --danger: #b63d36;
      --shadow: 0 12px 32px rgba(33, 52, 43, 0.09);
      font-family: Inter, ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
    }

    button, input, select { font: inherit; }

    button {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 11px;
      color: var(--ink);
      background: var(--panel);
      cursor: pointer;
    }

    button:hover { border-color: #96a49c; }
    button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid rgba(22, 107, 79, 0.24);
      outline-offset: 2px;
    }

    button.primary {
      border-color: var(--accent);
      color: #fff;
      background: var(--accent);
    }

    button.quiet { background: transparent; }
    button.danger { color: var(--danger); }
    button:disabled { cursor: not-allowed; opacity: 0.45; }

    input[type="number"] {
      width: 72px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 8px;
      background: #fff;
    }

    .prototype-ribbon {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 42px;
      padding: 8px 18px;
      color: #e9fff4;
      background: #14261e;
      font-size: 13px;
    }

    .prototype-ribbon strong { color: #7ee2b5; }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      color: #fff;
      background: var(--accent);
      font-weight: 800;
      letter-spacing: -1px;
    }

    .brand h1 { margin: 0; font-size: 17px; }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }

    .live-strip {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #28a96b;
      box-shadow: 0 0 0 4px rgba(40, 169, 107, 0.14);
    }

    .role-toggle[aria-pressed="true"] {
      border-color: #2c6677;
      color: #174d5d;
      background: #e2f3f7;
    }

    .viewer-banner {
      display: none;
      padding: 10px 20px;
      border-bottom: 1px solid #bedce4;
      color: #174d5d;
      background: #eaf7fa;
      text-align: center;
      font-size: 13px;
    }

    body.viewer-mode .viewer-banner { display: block; }
    body.viewer-mode .host-only { display: none !important; }
    body.viewer-mode .variant-a { grid-template-columns: 280px minmax(460px, 1fr); }
    body.viewer-mode .variant-c { grid-template-columns: 1fr; }

    .workspace { min-height: calc(100vh - 116px); }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-title h2, .section-title h3 { margin: 0; }
    .section-title h2 { font-size: 18px; }
    .section-title h3 { font-size: 15px; }
    .section-title small { color: var(--muted); }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .muted { color: var(--muted); }
    .tiny { font-size: 12px; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 999px;
      padding: 4px 8px;
      color: #3f4b45;
      background: #eef1ef;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .pill.full { color: #7d480d; background: #fff0d8; }
    .pill.over { color: #8c2d2a; background: #ffe3e1; }
    .pill.open { color: #155f46; background: #def4e9; }

    .person-card {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 9px;
      background: #fff;
      cursor: grab;
      user-select: none;
    }

    body.viewer-mode .person-card { cursor: default; }
    .person-card:hover { border-color: #aab6af; }
    .person-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(22, 107, 79, 0.13);
    }

    .person-card.dragging { opacity: 0.42; }

    .avatar {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      color: #fff;
      background: #385c4d;
      font-weight: 800;
    }

    .person-copy { min-width: 0; flex: 1; }
    .person-copy strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .person-copy span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }

    .claim-dot {
      flex: 0 0 auto;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #28a96b;
    }

    .claim-dot.guest { background: #a9b1ad; }

    .drop-zone {
      min-height: 70px;
      transition: background 120ms ease, outline-color 120ms ease;
    }

    .drop-zone.drag-over {
      outline: 2px dashed var(--accent);
      outline-offset: -4px;
      background: var(--accent-soft) !important;
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 64px;
      border: 1px dashed #c6cec9;
      border-radius: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .capacity-control {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .capacity-control button { border: 0; padding: 4px 7px; background: transparent; }
    .capacity-control strong { min-width: 24px; text-align: center; font-size: 12px; }

    .selected-actionbar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid #a9ccb9;
      border-radius: 11px;
      background: #eefaf4;
      font-size: 12px;
    }

    .selected-actionbar strong { margin-right: auto; }

    .toast {
      position: fixed;
      top: 76px;
      left: 50%;
      z-index: 80;
      transform: translate(-50%, -10px);
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      background: #21352c;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: 160ms ease;
    }

    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    /* Variant A: command rail + waiting list + team canvas */
    .variant-a {
      display: grid;
      grid-template-columns: 230px 280px minmax(460px, 1fr);
      min-height: calc(100vh - 116px);
    }

    .a-controls {
      padding: 20px 16px 96px;
      border-right: 1px solid var(--line);
      background: #edf2ee;
    }

    .control-group {
      margin-bottom: 22px;
      padding-bottom: 18px;
      border-bottom: 1px solid #d5ddd7;
    }

    .control-group:last-child { border-bottom: 0; }
    .control-group label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; font-size: 12px; }
    .control-group .stack { display: grid; gap: 8px; margin-top: 10px; }

    .a-pending {
      padding: 20px 16px 96px;
      border-right: 1px solid var(--line);
      background: #fafbf9;
    }

    .pending-list { display: grid; gap: 8px; }

    .a-teams { padding: 20px 20px 96px; overflow: auto; }
    .team-grid { display: grid; grid-template-columns: repeat(2, minmax(230px, 1fr)); gap: 14px; }

    .team-panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-top: 4px solid var(--team-accent);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 4px 14px rgba(30, 53, 43, 0.05);
    }

    .team-panel.over-capacity { border-color: #e0a09c; border-top-color: var(--danger); }

    .team-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .team-head h3 { margin: 0; font-size: 14px; }
    .team-head p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .team-members { display: grid; gap: 7px; padding: 10px; background: #fbfcfb; }
    .team-footer { display: flex; gap: 6px; padding: 9px 10px 11px; border-top: 1px solid var(--line); }
    .team-footer button { flex: 1; padding: 6px 8px; font-size: 11px; }

    /* Variant B: dense assignment matrix */
    .variant-b { padding-bottom: 96px; background: #f1eee8; }

    .b-toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 22px;
      border-bottom: 1px solid #d5d0c8;
      background: #fffdf9;
    }

    .b-toolbar h2 { margin: 0 auto 0 0; font-family: Georgia, serif; font-size: 20px; }
    .b-toolbar label { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }

    .pending-ribbon {
      padding: 14px 22px;
      border-bottom: 1px solid #d5d0c8;
      background: #e6ded1;
    }

    .pending-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 3px;
    }

    .pending-row .person-card { min-width: 180px; }

    .matrix-wrap { overflow-x: auto; padding: 18px 22px; }
    .team-matrix { display: grid; grid-auto-columns: minmax(210px, 1fr); grid-auto-flow: column; gap: 10px; min-width: max-content; }

    .matrix-column {
      width: min(260px, 22vw);
      min-width: 210px;
      border: 1px solid #cfc8bd;
      background: #fffdf9;
    }

    .matrix-head { padding: 12px; border-bottom: 3px solid var(--team-accent); }
    .matrix-head-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .matrix-head h3 { margin: 0; font-family: Georgia, serif; font-size: 16px; }
    .matrix-head-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; }
    .matrix-members { display: grid; align-content: start; gap: 7px; min-height: 360px; padding: 9px; }
    .matrix-members .person-card { border-radius: 5px; }

    /* Variant C: visual stage + focused inspector */
    .variant-c {
      display: grid;
      grid-template-columns: minmax(520px, 1fr) 320px;
      min-height: calc(100vh - 116px);
      padding-bottom: 96px;
      background: #18211d;
    }

    .stage {
      padding: 24px;
      color: #f0f5f2;
    }

    .stage .eyebrow { color: #7ee2b5; }
    .stage .muted { color: #a9b8b0; }

    .stage-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    .stage-heading h2 { margin: 0; font-size: 26px; letter-spacing: -0.04em; }

    .team-lanes { display: grid; gap: 9px; }

    .team-lane {
      display: grid;
      grid-template-columns: 145px minmax(300px, 1fr);
      min-height: 84px;
      overflow: hidden;
      border: 1px solid #405149;
      border-left: 6px solid var(--team-accent);
      border-radius: 12px;
      background: #213029;
    }

    .team-lane.over-capacity { border-color: #a95954; border-left-color: #f06f66; }

    .lane-label { display: flex; flex-direction: column; justify-content: center; padding: 12px; border-right: 1px solid #405149; }
    .lane-label h3 { margin: 0 0 5px; font-size: 14px; }
    .lane-label span { color: #a9b8b0; font-size: 11px; }
    .lane-members { display: flex; align-items: center; gap: 7px; overflow-x: auto; padding: 10px; }
    .lane-members .person-card { min-width: 155px; border-color: #53665c; color: #eaf3ee; background: #2b3b33; }
    .lane-members .person-copy span { color: #a9b8b0; }

    .pending-dock {
      margin-top: 14px;
      padding: 12px;
      border: 1px dashed #617269;
      border-radius: 12px;
      background: #202c26;
    }

    .pending-dock .pending-row .person-card { border-color: #53665c; color: #eaf3ee; background: #2b3b33; }
    .pending-dock .person-copy span { color: #a9b8b0; }

    .inspector {
      padding: 22px 18px 110px;
      border-left: 1px solid #39473f;
      color: #eaf3ee;
      background: #111915;
    }

    .inspector-card {
      margin-bottom: 14px;
      border: 1px solid #3d4d44;
      border-radius: 12px;
      padding: 14px;
      background: #1b2721;
    }

    .inspector-card h3 { margin: 0 0 10px; font-size: 14px; }
    .inspector-card p { color: #a9b8b0; font-size: 12px; line-height: 1.55; }
    .inspector-card button { border-color: #506158; color: #eaf3ee; background: #24332b; }
    .inspector-card button.primary { border-color: #4eb583; background: #167052; }
    .inspector .capacity-control { border-color: #506158; background: #24332b; }
    .inspector .capacity-control button { color: #eaf3ee; }
    .team-command-list { display: grid; gap: 7px; }
    .team-command { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 7px; }

    .prototype-switcher {
      position: fixed;
      bottom: 18px;
      left: 50%;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      transform: translateX(-50%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      padding: 7px;
      color: #fff;
      background: #101713;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.28);
    }

    .prototype-switcher button {
      width: 36px;
      height: 36px;
      border-color: #34443b;
      border-radius: 50%;
      padding: 0;
      color: #fff;
      background: #243229;
      font-size: 17px;
    }

    .variant-label { min-width: 190px; text-align: center; font-size: 12px; }
    .variant-label strong { display: block; font-size: 13px; }

    .state-debug {
      position: fixed;
      right: 14px;
      bottom: 15px;
      z-index: 90;
      width: 235px;
      border: 1px solid #cdd5d0;
      border-radius: 10px;
      padding: 8px 10px;
      color: #304139;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
      font-size: 11px;
    }

    .state-debug summary { cursor: pointer; font-weight: 800; }
    .state-debug pre { max-height: 170px; overflow: auto; margin: 8px 0 0; white-space: pre-wrap; }

    @media (max-width: 1050px) {
      .variant-a { grid-template-columns: 210px 240px minmax(420px, 1fr); overflow-x: auto; }
      .team-grid { grid-template-columns: 1fr; }
      .variant-c { grid-template-columns: 1fr; }
      .inspector { border-top: 1px solid #39473f; border-left: 0; }
    }

    @media (max-width: 720px) {
      .prototype-ribbon { align-items: flex-start; flex-direction: column; }
      .app-header { align-items: flex-start; flex-direction: column; }
      .live-strip { flex-wrap: wrap; }
      .variant-a { display: block; overflow: visible; }
      .a-controls, .a-pending { border-right: 0; border-bottom: 1px solid var(--line); }
      .team-grid { grid-template-columns: 1fr; }
      .b-toolbar { align-items: flex-start; flex-direction: column; }
      .b-toolbar h2 { margin: 0; }
      .variant-c { display: block; }
      .stage { padding: 18px 12px; }
      .team-lane { grid-template-columns: 105px minmax(300px, 1fr); }
      .state-debug { display: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    const variantMeta = {
      A: { name: "调度台", note: "控制栏 + 待分配 + 队伍画布" },
      B: { name: "分队矩阵", note: "横向名单 + 高密度队列" },
      C: { name: "现场舞台", note: "结果优先 + 右侧指挥器" }
    };

    const memberSeed = [
      ["p1", "阿青", 3270, "t1", true], ["p2", "阿洛", 2980, "t1", true],
      ["p3", "小满", 2840, "t1", false], ["p4", "栗子", 3150, "t2", true],
      ["p5", "西瓜", 3010, "t2", true], ["p6", "老周", 2760, "t2", false],
      ["p7", "Anson", 2680, "t2", true], ["p8", "星野", 3230, "t3", true],
      ["p9", "Kiki", 2890, "t3", true], ["p10", "纸鸢", 2800, "t3", false],
      ["p11", "大熊", 2600, "t3", true], ["p12", "南风", 3100, "t4", true],
      ["p13", "桃子", 2920, "t4", true], ["p14", "木木", 2710, "t4", false],
      ["p15", "Fox", 2550, "t4", true], ["p16", "十一", 3060, null, true],
      ["p17", "卡卡", 2790, null, false], ["p18", "阿布", 2640, null, true]
    ];

    const state = {
      role: "host",
      selectedMemberId: null,
      revision: 18,
      updatedLabel: "刚刚",
      teams: [
        { id: "t1", name: "赤焰", capacity: 4, accent: "#d95b52" },
        { id: "t2", name: "苍蓝", capacity: 4, accent: "#397ca7" },
        { id: "t3", name: "青岚", capacity: 5, accent: "#3b8b65" },
        { id: "t4", name: "金砂", capacity: 3, accent: "#b8862e" }
      ],
      members: memberSeed.map(([id, name, rating, teamId, claimed]) => ({ id, name, rating, teamId, claimed }))
    };

    const app = document.querySelector("#app");
    const toast = document.querySelector("#toast");
    let draggedMemberId = null;
    let toastTimer = null;

    function currentVariant() {
      const value = new URLSearchParams(location.search).get("variant")?.toUpperCase();
      return variantMeta[value] ? value : "A";
    }

    function membersFor(teamId) {
      return state.members.filter(member => member.teamId === teamId);
    }

    function teamLoad(team) {
      return membersFor(team.id).length;
    }

    function teamState(team) {
      const load = teamLoad(team);
      if (load > team.capacity) return "over";
      if (load === team.capacity) return "full";
      return "open";
    }

    function loadLabel(team) {
      const status = teamState(team);
      return status === "over" ? `超员 ${teamLoad(team)}/${team.capacity}` : status === "full" ? `已满 ${teamLoad(team)}/${team.capacity}` : `${teamLoad(team)}/${team.capacity}`;
    }

    function selectedMember() {
      return state.members.find(member => member.id === state.selectedMemberId) ?? null;
    }

    function personCard(member, compact = false) {
      const selected = member.id === state.selectedMemberId ? " selected" : "";
      const draggable = state.role === "host" ? "true" : "false";
      return `
        <div class="person-card${selected}" draggable="${draggable}" tabindex="0" data-member-id="${member.id}" aria-label="${member.name}，积分 ${member.rating}">
          <span class="avatar">${member.name.slice(0, 1)}</span>
          <span class="person-copy">
            <strong>${member.name}</strong>
            <span>${compact ? member.rating : `${member.rating} 分 · ${member.claimed ? "已认领" : "访客牌"}`}</span>
          </span>
          <span class="claim-dot${member.claimed ? "" : " guest"}" title="${member.claimed ? "已认领" : "访客牌"}"></span>
        </div>`;
    }

    function cardsOrEmpty(members, message, compact = false) {
      return members.length ? members.map(member => personCard(member, compact)).join("") : `<div class="empty-state">${message}</div>`;
    }

    function capacityControl(team) {
      return `
        <span class="capacity-control host-only" aria-label="${team.name}容量">
          <button type="button" data-action="capacity" data-team-id="${team.id}" data-delta="-1" aria-label="减少${team.name}容量">−</button>
          <strong>${team.capacity}</strong>
          <button type="button" data-action="capacity" data-team-id="${team.id}" data-delta="1" aria-label="增加${team.name}容量">＋</button>
        </span>`;
    }

    function selectedActions() {
      const member = selectedMember();
      if (!member || state.role !== "host") return `<div class="selected-actionbar host-only"><span class="muted">点选人员牌后，可用按钮移动；也可直接拖拽。</span></div>`;
      const current = state.teams.find(team => team.id === member.teamId)?.name ?? "待分配";
      const targets = state.teams.map(team => `<button type="button" data-action="move-selected" data-team-id="${team.id}" ${member.teamId === team.id ? "disabled" : ""}>${team.name}</button>`).join("");
      return `<div class="selected-actionbar host-only"><strong>${member.name} · 当前 ${current}</strong>${targets}<button type="button" data-action="move-selected" data-team-id="" ${member.teamId === null ? "disabled" : ""}>撤回</button></div>`;
    }

    function sharedHeader() {
      const pending = membersFor(null).length;
      const assigned = state.members.length - pending;
      return `
        <div class="prototype-ribbon">
          <span><strong>THROWAWAY PROTOTYPE</strong> · 数据仅在内存中，刷新即复位</span>
          <span>问题：哪种布局最适合主持人分队，同时让只读用户看懂结果？</span>
        </div>
        <header class="app-header">
          <div class="brand">
            <span class="brand-mark">TT</span>
            <div><h1>DOTA 周五训练 · 房间 7K4P</h1><p>游戏项目：DOTA 2 · 主持人：spume</p></div>
          </div>
          <div class="live-strip">
            <span class="live-dot" aria-hidden="true"></span>
            <span>实时版本 ${state.revision} · ${state.updatedLabel}</span>
            <span>${assigned} 已分配 / ${pending} 待分配</span>
            <button class="role-toggle" type="button" data-action="toggle-role" aria-pressed="${state.role === "viewer"}">${state.role === "host" ? "切到观众视图" : "返回主持人视图"}</button>
          </div>
        </header>
        <div class="viewer-banner">只读实时视图：分队变化会自动更新；你不能移动人员牌或修改容量。</div>`;
    }

    function teamPanelA(team) {
      const status = teamState(team);
      return `
        <section class="team-panel drop-zone ${status === "over" ? "over-capacity" : ""}" style="--team-accent:${team.accent}" data-drop-team="${team.id}">
          <div class="team-head">
            <div><h3>${team.name}</h3><p>${status === "over" ? "先移出人员后才能继续加入" : status === "full" ? "容量已满" : `还可加入 ${team.capacity - teamLoad(team)} 人`}</p></div>
            <div><span class="pill ${status}">${loadLabel(team)}</span> ${capacityControl(team)}</div>
          </div>
          <div class="team-members">${cardsOrEmpty(membersFor(team.id), "拖到这里加入队伍")}</div>
          <div class="team-footer host-only"><button type="button" data-action="move-selected" data-team-id="${team.id}">将已选人员移入</button></div>
        </section>`;
    }

    function variantA() {
      const overCount = state.teams.filter(team => teamState(team) === "over").length;
      return `
        <main class="workspace variant-a">
          <aside class="a-controls host-only">
            <p class="eyebrow">房间设置</p><h2 style="margin:0 0 18px">主持人调度台</h2>
            <div class="control-group">
              <label>队伍数量 <input type="number" min="2" max="16" value="${state.teams.length}" data-control="team-count"></label>
              <label>统一容量 <input type="number" min="1" max="20" value="4" data-control="bulk-capacity"></label>
              <div class="stack"><button type="button" data-action="apply-bulk-capacity">应用到全部队伍</button></div>
            </div>
            <div class="control-group">
              <p class="tiny"><strong>容量规则</strong></p>
              <p class="tiny muted">满员后拒绝继续加入；缩小容量不会自动移人，而是显示超员。</p>
              ${overCount ? `<span class="pill over">${overCount} 个队伍超员</span>` : `<span class="pill open">当前无超员</span>`}
            </div>
            <div class="control-group">
              <button type="button" data-action="reset" class="quiet">复位原型数据</button>
            </div>
          </aside>
          <section class="a-pending drop-zone" data-drop-team="">
            <div class="section-title"><div><p class="eyebrow">Waiting</p><h2>待分配</h2></div><span class="pill">${membersFor(null).length} 人</span></div>
            ${selectedActions()}
            <div class="pending-list" style="margin-top:10px">${cardsOrEmpty(membersFor(null), "所有人都已分配")}</div>
          </section>
          <section class="a-teams">
            <div class="section-title"><div><p class="eyebrow">Teams</p><h2>当前分队结果</h2></div><small>拖拽后立即同步给参与者与观众</small></div>
            <div class="team-grid">${state.teams.map(teamPanelA).join("")}</div>
          </section>
        </main>`;
    }

    function matrixColumn(team) {
      const status = teamState(team);
      return `
        <section class="matrix-column drop-zone ${status === "over" ? "over-capacity" : ""}" data-drop-team="${team.id}" style="--team-accent:${team.accent}">
          <div class="matrix-head">
            <div class="matrix-head-top"><h3>${team.name}</h3><span class="pill ${status}">${loadLabel(team)}</span></div>
            <div class="matrix-head-bottom"><span class="tiny muted">${status === "over" ? "需要移出" : status === "full" ? "已锁定加入" : "可继续加入"}</span>${capacityControl(team)}</div>
          </div>
          <div class="matrix-members">${cardsOrEmpty(membersFor(team.id), "拖入人员", true)}</div>
        </section>`;
    }

    function variantB() {
      return `
        <main class="workspace variant-b">
          <div class="b-toolbar">
            <h2>分队矩阵 / Assignment Matrix</h2>
            <div class="host-only">${selectedActions()}</div>
            <label class="host-only">队伍数 <input type="number" min="2" max="16" value="${state.teams.length}" data-control="team-count"></label>
            <button class="host-only" type="button" data-action="reset">复位</button>
          </div>
          <section class="pending-ribbon drop-zone" data-drop-team="">
            <div class="section-title"><div><p class="eyebrow">入口队列</p><h3>待分配 ${membersFor(null).length} 人</h3></div><small>横向浏览，拖入下方任一列</small></div>
            <div class="pending-row">${cardsOrEmpty(membersFor(null), "队列为空", true)}</div>
          </section>
          <section class="matrix-wrap">
            <div class="team-matrix">${state.teams.map(matrixColumn).join("")}</div>
          </section>
        </main>`;
    }

    function lane(team) {
      const status = teamState(team);
      return `
        <section class="team-lane drop-zone ${status === "over" ? "over-capacity" : ""}" data-drop-team="${team.id}" style="--team-accent:${team.accent}">
          <div class="lane-label"><h3>${team.name}</h3><span>${loadLabel(team)} · ${status === "open" ? "开放" : status === "full" ? "满员" : "超员"}</span></div>
          <div class="lane-members">${cardsOrEmpty(membersFor(team.id), "空队伍", true)}</div>
        </section>`;
    }

    function inspector() {
      const member = selectedMember();
      return `
        <aside class="inspector host-only">
          <p class="eyebrow">Command</p><h2 style="margin:0 0 18px">指挥器</h2>
          <section class="inspector-card">
            <h3>${member ? `已选：${member.name}` : "先选择一张人员牌"}</h3>
            <p>${member ? `积分 ${member.rating}。选择目标队伍即可移动；满员队伍会拒绝加入。` : "可从舞台或待分配区点选，也可直接拖拽。"}</p>
            ${member && member.teamId ? `<button type="button" data-action="move-selected" data-team-id="">撤回待分配</button>` : ""}
          </section>
          <section class="inspector-card">
            <h3>队伍指令</h3>
            <div class="team-command-list">
              ${state.teams.map(team => `<div class="team-command"><button type="button" data-action="move-selected" data-team-id="${team.id}" ${!member || member.teamId === team.id ? "disabled" : ""}>移入 ${team.name}</button><span class="pill ${teamState(team)}">${loadLabel(team)}</span>${capacityControl(team)}</div>`).join("")}
            </div>
          </section>
          <section class="inspector-card">
            <h3>舞台设置</h3>
            <label class="tiny">队伍数量 <input type="number" min="2" max="16" value="${state.teams.length}" data-control="team-count"></label>
            <p>参与者与观众只看到左侧舞台，不显示本指挥器。</p>
          </section>
        </aside>`;
    }

    function variantC() {
      return `
        <main class="workspace variant-c">
          <section class="stage">
            <div class="stage-heading"><div><p class="eyebrow">Live formation</p><h2>分队现场</h2><p class="muted tiny">结果优先展示；操作收进右侧指挥器</p></div><span class="pill">版本 ${state.revision}</span></div>
            <div class="team-lanes">${state.teams.map(lane).join("")}</div>
            <section class="pending-dock drop-zone" data-drop-team="">
              <div class="section-title"><h3>待分配 · ${membersFor(null).length}</h3><small class="muted">拖回此处即撤回</small></div>
              <div class="pending-row">${cardsOrEmpty(membersFor(null), "所有人已上场", true)}</div>
            </section>
          </section>
          ${inspector()}
        </main>`;
    }

    function stateDebug() {
      const summary = {
        role: state.role,
        revision: state.revision,
        selected: selectedMember()?.name ?? null,
        pending: membersFor(null).map(member => member.name),
        teams: state.teams.map(team => ({ name: team.name, load: teamLoad(team), capacity: team.capacity, status: teamState(team) }))
      };
      return `<details class="state-debug"><summary>完整原型状态</summary><pre>${JSON.stringify(summary, null, 2)}</pre></details>`;
    }

    function switcher(variant) {
      if (new URLSearchParams(location.search).get("prototype") === "0") return "";
      const meta = variantMeta[variant];
      return `
        <nav class="prototype-switcher" aria-label="原型变体切换">
          <button type="button" data-action="variant-prev" aria-label="上一个变体">←</button>
          <span class="variant-label"><strong>${variant} — ${meta.name}</strong>${meta.note}</span>
          <button type="button" data-action="variant-next" aria-label="下一个变体">→</button>
        </nav>`;
    }

    function render() {
      const variant = currentVariant();
      document.body.classList.toggle("viewer-mode", state.role === "viewer");
      app.innerHTML = `${sharedHeader()}${variant === "A" ? variantA() : variant === "B" ? variantB() : variantC()}${stateDebug()}${switcher(variant)}`;
      bindDragAndDrop();
    }

    function announce(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function touchRevision(message) {
      state.revision += 1;
      state.updatedLabel = "刚刚";
      announce(message);
      render();
    }

    function moveMember(memberId, targetTeamId) {
      if (state.role !== "host") return;
      const member = state.members.find(item => item.id === memberId);
      if (!member) return;
      const normalizedTarget = targetTeamId || null;
      if (member.teamId === normalizedTarget) return;
      if (normalizedTarget) {
        const target = state.teams.find(team => team.id === normalizedTarget);
        if (!target) return;
        if (teamLoad(target) >= target.capacity) {
          announce(`${target.name}已满，不能继续加入`);
          return;
        }
      }
      member.teamId = normalizedTarget;
      state.selectedMemberId = member.id;
      const destination = state.teams.find(team => team.id === normalizedTarget)?.name ?? "待分配";
      touchRevision(`${member.name} 已移动到${destination}`);
    }

    function changeCapacity(teamId, delta) {
      if (state.role !== "host") return;
      const team = state.teams.find(item => item.id === teamId);
      if (!team) return;
      team.capacity = Math.max(1, Math.min(20, team.capacity + delta));
      touchRevision(`${team.name}容量调整为 ${team.capacity}`);
    }

    function setTeamCount(rawCount) {
      if (state.role !== "host") return;
      const count = Math.max(2, Math.min(16, Number(rawCount) || state.teams.length));
      if (count === state.teams.length) return;
      if (count < state.teams.length) {
        const removedIds = new Set(state.teams.slice(count).map(team => team.id));
        state.members.forEach(member => { if (removedIds.has(member.teamId)) member.teamId = null; });
        state.teams = state.teams.slice(0, count);
      } else {
        const accents = ["#7757a8", "#bb6b2f", "#2f8790", "#a94f79", "#66743d", "#765748"];
        while (state.teams.length < count) {
          const number = state.teams.length + 1;
          state.teams.push({ id: `t${number}`, name: `队伍 ${number}`, capacity: 4, accent: accents[(number - 5) % accents.length] });
        }
      }
      touchRevision(`队伍数量调整为 ${count}`);
    }

    function setVariant(direction) {
      const keys = Object.keys(variantMeta);
      const index = keys.indexOf(currentVariant());
      const next = keys[(index + direction + keys.length) % keys.length];
      const params = new URLSearchParams(location.search);
      params.set("variant", next);
      history.replaceState(null, "", `${location.pathname}?${params.toString()}`);
      render();
    }

    function bindDragAndDrop() {
      document.querySelectorAll(".person-card").forEach(card => {
        card.addEventListener("dragstart", event => {
          if (state.role !== "host") return event.preventDefault();
          draggedMemberId = card.dataset.memberId;
          card.classList.add("dragging");
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", draggedMemberId);
        });
        card.addEventListener("dragend", () => {
          draggedMemberId = null;
          document.querySelectorAll(".drag-over").forEach(zone => zone.classList.remove("drag-over"));
        });
      });

      document.querySelectorAll("[data-drop-team]").forEach(zone => {
        zone.addEventListener("dragover", event => {
          if (state.role !== "host") return;
          event.preventDefault();
          zone.classList.add("drag-over");
        });
        zone.addEventListener("dragleave", event => {
          if (!zone.contains(event.relatedTarget)) zone.classList.remove("drag-over");
        });
        zone.addEventListener("drop", event => {
          event.preventDefault();
          zone.classList.remove("drag-over");
          moveMember(event.dataTransfer.getData("text/plain") || draggedMemberId, zone.dataset.dropTeam);
        });
      });
    }

    document.addEventListener("click", event => {
      const memberCard = event.target.closest("[data-member-id]");
      if (memberCard && state.role === "host") {
        state.selectedMemberId = memberCard.dataset.memberId;
        render();
        return;
      }

      const actionButton = event.target.closest("[data-action]");
      if (!actionButton) return;
      const action = actionButton.dataset.action;
      if (action === "variant-prev") return setVariant(-1);
      if (action === "variant-next") return setVariant(1);
      if (action === "toggle-role") {
        state.role = state.role === "host" ? "viewer" : "host";
        render();
        return;
      }
      if (action === "capacity") return changeCapacity(actionButton.dataset.teamId, Number(actionButton.dataset.delta));
      if (action === "move-selected" && state.selectedMemberId) return moveMember(state.selectedMemberId, actionButton.dataset.teamId);
      if (action === "apply-bulk-capacity") {
        const input = document.querySelector("[data-control='bulk-capacity']");
        const capacity = Math.max(1, Math.min(20, Number(input?.value) || 4));
        state.teams.forEach(team => { team.capacity = capacity; });
        return touchRevision(`全部队伍容量调整为 ${capacity}`);
      }
      if (action === "reset") location.reload();
    });

    document.addEventListener("change", event => {
      if (event.target.matches("[data-control='team-count']")) setTeamCount(event.target.value);
    });

    document.addEventListener("keydown", event => {
      const tag = event.target.tagName;
      if (["INPUT", "TEXTAREA", "SELECT"].includes(tag) || event.target.isContentEditable) return;
      if (event.key === "ArrowLeft") setVariant(-1);
      if (event.key === "ArrowRight") setVariant(1);
      if ((event.key === "Enter" || event.key === " ") && event.target.matches("[data-member-id]") && state.role === "host") {
        event.preventDefault();
        state.selectedMemberId = event.target.dataset.memberId;
        render();
      }
    });

    function selfCheck() {
      const overloaded = state.teams.find(team => team.id === "t4");
      const full = state.teams.find(team => team.id === "t2");
      console.assert(teamState(overloaded) === "over", "prototype check: shrinking capacity must expose over-capacity");
      console.assert(teamState(full) === "full", "prototype check: a team at capacity must be full");
      console.assert(membersFor(null).length === 3, "prototype check: pending roster must be visible");
    }

    selfCheck();
    render();
  </script>
</body>
</html>
