  /v1/rooms/{roomId}/commands:
    post:
      tags:
        - rooms
      operationId: executeRoomCommand
      summary: 执行类型化房间命令
      description: 服务端先重新鉴权，再校验 expectedRevision。旧 revision 优先返回 409；相同 commandId、操作者及规范化请求指纹重试返回首次结果，不同操作者或指纹返回
        IDEMPOTENCY_CONFLICT。合法但无变化的命令返回 changed=false，revision 不递增。
      security:
        - accountSession: []
          csrfToken: []
        - participantSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCommand"
            examples:
              changedCommand:
                summary: 改变状态并递增 revision
                value:
                  roomId: 018f5f1e-17d8-7a38-94d0-ecf3184ccf23
                  commandId: 018f5f2b-e0c2-7e80-baf1-7a05e7d9bfa2
                  expectedRevision: 8
                  type: movePlayerCard
                  payload:
                    playerCardId: pc-1
                    teamId: team-2
              noChangeCommand:
                summary: 当前版本上的合法无变化命令
                value:
                  roomId: 018f5f1e-17d8-7a38-94d0-ecf3184ccf23
                  commandId: 018f5f31-246c-7681-b6a6-974894a2c281
                  expectedRevision: 9
                  type: movePlayerCard
                  payload:
                    playerCardId: pc-1
                    teamId: team-2
              staleRevision:
                summary: 旧 revision，即使目标状态相同也返回 REVISION_CONFLICT
                value:
                  roomId: 018f5f1e-17d8-7a38-94d0-ecf3184ccf23
                  commandId: 018f5f38-d1b9-73ea-a1a4-f49b9c686c82
                  expectedRevision: 7
                  type: movePlayerCard
                  payload:
                    playerCardId: pc-1
                    teamId: team-2
              idempotencyFingerprintConflict:
                summary: 复用 commandId 但请求指纹不同，返回 IDEMPOTENCY_CONFLICT
                value:
                  roomId: 018f5f1e-17d8-7a38-94d0-ecf3184ccf23
                  commandId: 018f5f2b-e0c2-7e80-baf1-7a05e7d9bfa2
                  expectedRevision: 8
                  type: movePlayerCard
                  payload:
                    playerCardId: pc-1
                    teamId: team-1
              multipleViolations:
                summary: 多字段输入错误，返回 violations
                value:
                  roomId: 018f5f1e-17d8-7a38-94d0-ecf3184ccf23
                  commandId: not-a-uuid
                  expectedRevision: -1
                  type: movePlayerCard
                  payload: {}
      responses:
        "200":
          description: executeRoomCommand 专属成功结果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteRoomCommandResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/rooms/{roomId}/snapshot:
    get:
      tags:
        - rooms
      operationId: getRoomSnapshot
      summary: 读取当前角色的完整权威快照
      description: 每次按当前访问凭据重新鉴权，从一致读取视图返回角色可见的完整状态与服务端计算 capability。Caddy、浏览器缓存或条件读取都不得作为状态恢复机制。
      security:
        - accountSession: []
        - participantSession: []
        - spectatorSession: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: 按当前角色返回完整快照；Caddy、浏览器缓存和条件读取均不得作为恢复机制。
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRoomSnapshotResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/rooms/{roomId}/events:
    get:
      tags:
        - rooms
      operationId: streamRoomInvalidations
      summary: 订阅房间失效通知
      description: 初连和重连均须读取完整快照校准。SSE 是低延迟提示而非领域事件、状态差量或 可靠历史；丢失、重复、迟到、乱序或跳号都通过快照恢复。401/404 是停止重连终态。
      security:
        - accountSession: []
        - participantSession: []
        - spectatorSession: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: Last-Event-ID
          in: header
          required: false
          description: 可选提示；不保证历史补发，值为客户端最后处理的 revision。
          schema:
            type: string
            pattern: ^[0-9]+$
      responses:
        "200":
          description: 先订阅再读取当前 revision；通知不提供历史，初连与重连均读取完整快照校准。
          content:
            text/event-stream:
              schema:
                type: string
          x-sse-heartbeat-interval-seconds: 15
          x-sse-heartbeat-format: ": heartbeat"
          x-sse-event-id: revision
          x-sse-subscription-order:
            - subscribe
            - read-current-revision
            - send-current-revision
          x-sse-listener-failure-action: close-stream-for-reconnect
        "204":
          description: 房间删除、不可见或访问不可恢复时返回；EventSource 将停止自动重连。
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-sse-terminal-response:
        status: 204
        action: stop-reconnecting
      x-sse-auth-expiry-flow:
        - close-stream
        - refresh-access
        - read-role-snapshot
        - create-new-event-source
      x-sse-reconnect-calibration:
        - subscribe
        - read-role-snapshot
        - send-current-revision
      x-sse-subscription-order:
        - subscribe
        - read-current-revision
        - send-current-revision
      x-sse-listener-failure-action: close-stream-for-reconnect
components:
  securitySchemes:
    anonymousCsrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 未登录浏览器的同源 CSRF 令牌。
    accountSession:
      type: apiKey
      in: cookie
      name: __Host-ttsync-session
      description: 登录会话；不缓存团队或房间角色。
    participantSession:
      type: apiKey
      in: cookie
      name: __Host-ttsync-participant
    spectatorSession:
      type: apiKey
      in: cookie
      name: __Host-ttsync-spectator
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GameId:
      name: gameId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 512
    AvatarId:
      name: avatarId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AvatarContext:
      name: context
      in: query
      required: true
      description: 授权所依据的成员、房间、人员牌或历史快照资源 URI。
      schema:
        type: string
        minLength: 1
        maxLength: 512
  schemas:
    Email:
      type: string
      format: email
      maxLength: 254
    Password:
      type: string
      minLength: 15
      maxLength: 128
      description: 15–128 个可打印 Unicode code point，不裁剪或静默截断。
    EmptyRequest:
      type: object
      additionalProperties: false
    EmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          $ref: "#/components/schemas/Email"
    TokenRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 512
    RegisterAccountRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
        invitationToken:
          type: string
          minLength: 32
          maxLength: 512
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          minLength: 1
          maxLength: 128
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 512
        newPassword:
          $ref: "#/components/schemas/Password"
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          $ref: "#/components/schemas/Password"
    ChangeEmailRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newEmail
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newEmail:
          $ref: "#/components/schemas/Email"
    CreateTeamRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    CreateMemberRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
    UpdateMemberRequest:
      type: object
      additionalProperties: false
      required:
        - expectedRevision
        - action
      properties:
        expectedRevision:
          type: integer
          minimum: 0
        action:
          type: string
          enum:
            - updateProfile
            - deactivate
            - restore
            - unbind
            - leave
            - grantAdmin
            - revokeAdmin
        displayName:
          type: string
          minLength: 1
          maxLength: 100
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - memberId
        - email
      properties:
        memberId:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - expectedInvitationVersion
      properties:
        expectedInvitationVersion:
          type: integer
          minimum: 1
    CreateGameProjectRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    UpdateGameProjectRequest:
      type: object
      additionalProperties: false
      required:
        - expectedRevision
        - action
      properties:
        expectedRevision:
          type: integer
          minimum: 0
        action:
          type: string
          enum:
            - rename
            - deactivate
            - restore
        name:
