openapi: 3.1.0
info:
  title: TTSync MVP HTTP and SSE API
  version: 1.0.0
  description: MVP v1 的公开合同。房间命令使用 JSON expectedRevision，因此过期版本映射为 409 而不是 If-Match/412。SSE 仅作失效提示，客户端始终以角色化完整快照收敛。
servers:
  - url: /api
tags:
  - name: rooms
  - name: identity
  - name: teams
  - name: games
  - name: reporting
  - name: avatars
x-account-security:
  - accountSession: []
    csrfToken: []
x-public-security:
  - anonymousCsrf: []
x-request-parameter:
  - $ref: "#/components/parameters/RequestId"
paths:
  /v1/accounts:
    post:
      security:
        - anonymousCsrf: []
      responses:
        "200":
          description: registerAccount 专属成功结果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterAccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
      tags:
        - identity
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAccountRequest"
      summary: 注册账号并发送验证邮件
