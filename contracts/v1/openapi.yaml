          const: IDEMPOTENCY_CONFLICT
    StateConflictProblem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - detail
        - instance
        - requestId
        - status
        - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
        detail:
          type: string
          minLength: 1
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
          format: uuid
        status:
          type: integer
          const: 409
        code:
          type: string
          const: STATE_CONFLICT
  responses:
    BadRequest:
      description: 请求语法、JSON 或媒体类型无法解析（400）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/MalformedRequestProblem"
          example:
            type: https://ttsync.example/problems/malformed-request
            title: 请求无法解析
            status: 400
            detail: JSON 请求体不完整。
            instance: /problems/req-400
            code: MALFORMED_REQUEST
            requestId: req-400
    Unauthorized:
      description: 访问凭据缺失、无效或过期（401）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/UnauthorizedProblem"
          example:
            type: https://ttsync.example/problems/unauthorized
            title: 需要有效凭据
            status: 401
            detail: 房间访问凭据缺失或已过期。
            instance: /problems/req-401
            code: UNAUTHORIZED
            requestId: req-401
    Forbidden:
      description: 有效身份缺少当前操作权限（403）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ForbiddenProblem"
          example:
            type: https://ttsync.example/problems/forbidden
            title: 没有操作权限
            status: 403
            detail: 当前角色没有此 capability。
            instance: /problems/req-403
            code: FORBIDDEN
            requestId: req-403
    NotFound:
      description: 资源不存在或对调用者不可见（404）
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ResourceNotFoundProblem"
              - $ref: "#/components/schemas/RoomNotFoundProblem"
            discriminator:
              propertyName: code
          example:
            type: https://ttsync.example/problems/not-found
            title: 房间不可见
            status: 404
            detail: 房间不存在或当前凭据不能查看。
            instance: /problems/req-404
            code: ROOM_NOT_FOUND
            requestId: req-404
    Conflict:
      description: 版本、幂等指纹/操作者或资源状态冲突（409）
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/RevisionConflictProblem"
              - $ref: "#/components/schemas/IdempotencyConflictProblem"
              - $ref: "#/components/schemas/StateConflictProblem"
            discriminator:
              propertyName: code
          examples:
            revisionConflict:
              value:
                type: https://ttsync.example/problems/revision-conflict
                title: 房间已更新
                status: 409
                detail: 操作未应用，房间已更新。
                instance: /problems/req-1
                code: REVISION_CONFLICT
                requestId: req-1
                currentRevision: 9
            idempotencyConflict:
              value:
                type: https://ttsync.example/problems/idempotency-conflict
                title: 命令标识冲突
                status: 409
                detail: commandId 已由不同操作者或请求指纹使用。
                instance: /problems/req-2
                code: IDEMPOTENCY_CONFLICT
                requestId: req-2
    UnprocessableEntity:
      description: 语法可解析但输入不满足合同或领域规则（422）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"
          example:
            type: https://ttsync.example/problems/validation-failed
            title: 输入校验失败
            status: 422
            detail: 两个字段无效。
            instance: /problems/req-3
            code: VALIDATION_FAILED
            requestId: req-3
            violations:
              - path: /commandId
                code: INVALID_UUID
                message: 必须是 UUID。
              - path: /expectedRevision
                code: OUT_OF_RANGE
                message: 必须大于或等于 0。
    TooManyRequests:
      description: 请求超过限速（429）；调用者应遵循 Retry-After
      headers:
        Retry-After:
          required: true
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/RateLimitedProblem"
          example:
            type: https://ttsync.example/problems/rate-limited
            title: 请求过于频繁
            status: 429
            detail: 请在 Retry-After 指定时间后重试。
            instance: /problems/req-429
            code: RATE_LIMITED
            requestId: req-429
    InternalServerError:
      description: 未预期的服务端失败（500）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/InternalErrorProblem"
          example:
            type: https://ttsync.example/problems/internal-error
            title: 服务暂时失败
            status: 500
            detail: 请求未能完成，请使用 requestId 联系维护者。
            instance: /problems/req-500
            code: INTERNAL_ERROR
            requestId: req-500
