services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: ttsync
      POSTGRES_USER: ttsync
      POSTGRES_PASSWORD: ${TTSYNC_POSTGRES_PASSWORD:?set TTSYNC_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttsync -d ttsync"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    environment:
      DATABASE_URL: postgres://ttsync:${TTSYNC_POSTGRES_PASSWORD:?set TTSYNC_POSTGRES_PASSWORD}@postgres:5432/ttsync?sslmode=disable
      HTTP_ADDR: :8080
      PUBLIC_ORIGIN: ${TTSYNC_PUBLIC_ORIGIN:-https://localhost:8443}
      MAIL_OUTBOX_DIR: ${TTSYNC_MAIL_OUTBOX_DIR:-}
      SMTP_ADDR: ${TTSYNC_SMTP_ADDR:-}
      SMTP_FROM: ${TTSYNC_SMTP_FROM:-}
      SMTP_USERNAME: ${TTSYNC_SMTP_USERNAME:-}
      SMTP_PASSWORD: ${TTSYNC_SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/bin/sh", "-c", "/app/migrate && exec /app/ttsync"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TTSYNC_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "https://localhost/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
