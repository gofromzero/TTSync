services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ttsync
      POSTGRES_USER: ttsync
      POSTGRES_PASSWORD: ${TTSYNC_POSTGRES_PASSWORD:?set TTSYNC_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttsync -d ttsync"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    environment:
      DATABASE_URL: postgres://ttsync:${TTSYNC_POSTGRES_PASSWORD:?set TTSYNC_POSTGRES_PASSWORD}@postgres:5432/ttsync?sslmode=disable
      HTTP_ADDR: :8080
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/bin/sh", "-c", "/app/migrate && exec /app/ttsync"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TTSYNC_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
